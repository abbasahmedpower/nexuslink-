name: NexusLink CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Cargo check all workspace targets
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test workspace
        run: cargo test --workspace

  flutter-check:
    name: Flutter Desktop UI Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ui
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: ui
        run: flutter analyze

      - name: Run Flutter unit tests
        working-directory: ui
        run: flutter test

  scripts-and-contracts:
    name: Architecture & Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check architectural boundary constraints
        run: python scripts/check_structure.py

      - name: Verify IPC and Domain contracts
        run: python scripts/test_v04_contracts.py
