[package]
name = "nexus-ipc"
version.workspace = true
edition.workspace = true

[dependencies]
nexus-domain = { path = "../nexus-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "process", "signal", "rt", "fs"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
