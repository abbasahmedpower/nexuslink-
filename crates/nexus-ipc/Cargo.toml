[package]
name = "nexus-ipc"
version = "1.0.0"
edition = "2021"

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-application = { path = "../nexus-application" }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net"] }
