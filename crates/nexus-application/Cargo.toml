[package]
name = "nexus-application"
version = "0.4.0"
edition = "2021"

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-adapter-kde = { path = "../nexus-adapter-kde" }
nexus-adapter-scrcpy = { path = "../nexus-adapter-scrcpy" }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
