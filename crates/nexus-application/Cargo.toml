[package]
name = "nexus-application"
version.workspace = true
edition.workspace = true

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-ipc = { path = "../nexus-ipc" }
nexus-adapter-kde = { path = "../nexus-adapter-kde" }
nexus-adapter-scrcpy = { path = "../nexus-adapter-scrcpy" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "io-util", "rt"] }
tracing = "0.1"