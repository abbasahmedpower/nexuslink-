[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-application = { path = "../nexus-application" }
nexus-ipc = { path = "../nexus-ipc" }
nexus-adapter-kde = { path = "../nexus-adapter-kde" }
nexus-adapter-scrcpy = { path = "../nexus-adapter-scrcpy" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util", "process", "rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
