[package]
name = "nexus-core"
version = "0.4.0"
edition = "2021"

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-adapter-kde = { path = "../nexus-adapter-kde" }
nexus-adapter-scrcpy = { path = "../nexus-adapter-scrcpy" }
nexus-application = { path = "../nexus-application" }
nexus-ipc = { path = "../nexus-ipc" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
