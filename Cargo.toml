[workspace]
members = [
    "crates/nexus-domain",
    "crates/nexus-ipc",
    "crates/nexus-adapter-kde",
    "crates/nexus-adapter-scrcpy",
    "crates/nexus-application",
    "crates/nexus-core",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
